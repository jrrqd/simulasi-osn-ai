# Simulasi OSN AI — Nginx config
# - Listens on :80 (HTTP→HTTPS redirect + ACME http-01) and :443 (TLS).
# - Brotli + gzip at the edge.
# - /_next/static/* served directly from disk with ETag + Last-Modified.
#   These are content-hashed and immutable; 404s are NEVER cached by the
#   browser (Cache-Control: no-store on misses) so a stale cache can never
#   poison the site after a deploy.
# - HTML is no-store (set by Next.js); nginx micro-caches anonymous HTML
#   for 5s and revalidates with the origin on every other request.
# - Vary: Cookie is preserved so anonymous and logged-in HTML don't mix.
# - /api/auth/* rate-limited 10 r/m, /api/ai/* rate-limited 30 r/m.
# - HSTS lives here only (single source of truth at the edge).

limit_req_zone $binary_remote_addr zone=osnai_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=osnai_ai:10m rate=30r/m;

# Persistent micro-cache for anonymous HTML. `Vary: Cookie` already
# partitions logged-in vs anonymous, but we also skip caching whenever a
# Better-Auth cookie is present — see $skip_cache below.
proxy_cache_path /var/cache/nginx/osnai levels=1:2 keys_zone=osnai_cache:10m
                 max_size=200m inactive=10m use_temp_path=off;

# HTTP — force HTTPS except for the ACME http-01 challenge
server {
    listen 80;
    listen [::]:80;
    server_name radr.nxtdev.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radr.nxtdev.xyz;

    ssl_certificate     /etc/letsencrypt/live/radr.nxtdev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radr.nxtdev.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;
    root /var/www/osnai/public;

    # Security headers — single source of truth at the edge.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # Brotli + gzip
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/font-woff2;
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ============================================================
    # Hashed Next.js assets — served straight from disk.
    # `^~` short-circuits the .woff2 regex below so fonts under
    # /_next/static/media/ also use this block.
    # ============================================================
    location ^~ /_next/static/ {
        alias /var/www/osnai/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @next_static_missing;
    }
    # Never let the browser cache a 404 on a hashed asset — a stale 404
    # here is exactly what poisoned the domain's cache after a deploy
    # when CSS files got new hashes.
    location @next_static_missing {
        add_header Cache-Control "no-store, max-age=0" always;
        return 404 "";
    }

    # /public/* images served from disk.
    # `^~` so /public/foo.png wins over the generic .png regex.
    location ^~ /(belajar|simulasi|latihan|hero-atmosphere|favicon)\.(webp|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    # robots.txt and sitemap.xml are app-generated and may change
    # on deploy. Short cache so search engines pick up updates quickly.
    location = /robots.txt {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Generic asset cache (anything in /public with a hashed filename).
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Auth API — rate-limited, no cache
    location /api/auth/ {
        limit_req zone=osnai_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI API — rate-limited, no cache, long timeout for streamed responses
    location /api/ai/ {
        limit_req zone=osnai_ai burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # AI mock slots / assistants can take a few minutes per request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else (HTML pages) — micro-cache anonymous GETs for 5s.
    # The origin's Cache-Control (private, no-store) is preserved; we
    # only cache for the few seconds it takes for an immediate-reload
    # spam-burst to settle. Logged-in requests skip the cache entirely.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # Cache only anonymous GETs.
        set $skip_cache 0;
        if ($request_method != GET)        { set $skip_cache 1; }
        if ($http_cookie ~* "better-auth") { set $skip_cache 1; }
        if ($http_cookie ~* "session")     { set $skip_cache 1; }
        proxy_cache_bypass $skip_cache;
        proxy_no_cache     $skip_cache;
        proxy_cache        osnai_cache;
        proxy_cache_valid  200 5s;
        proxy_cache_valid  404 1s;
        # Re-validate conditional GETs (If-None-Match / If-Modified-Since).
        proxy_cache_revalidate on;
        # Keep Vary header so anonymous and logged-in don't mix.
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;
    }
}