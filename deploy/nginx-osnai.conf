# Simulasi OSN AI — Nginx config
# - Listens on :80 (HTTP→HTTPS redirect + ACME http-01) and :443 (TLS).
# - Brotli + gzip at the edge.
# - Long-TTL caching for `/_next/static/*` and `/public/*` served directly from disk.
# - 10s micro-cache for HTML/JSON GETs on public routes; cookies bypass cache.
# - `/api/auth/*` rate-limited 10 r/m, `/api/ai/*` rate-limited 30 r/m.

limit_req_zone $binary_remote_addr zone=osnai_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=osnai_ai:10m rate=30r/m;
proxy_cache_path /var/cache/nginx/osnai levels=1:2 keys_zone=osnai_cache:10m
                 max_size=200m inactive=60m use_temp_path=off;

# HTTP — force HTTPS except for the ACME http-01 challenge
server {
    listen 80;
    listen [::]:80;
    server_name radr.nxtdev.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name radr.nxtdev.xyz;

    ssl_certificate     /etc/letsencrypt/live/radr.nxtdev.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radr.nxtdev.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 2m;
    root /var/www/osnai/public;

    # Security headers — single source of truth
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # Brotli + gzip
    brotli on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml application/font-woff2;
    gzip on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Long-TTL caching for hashed assets and /public images.
# Use ^~ so the prefix short-circuits the .woff2 regex below for /_next/static/media/* fonts.
    location ^~ /_next/static/ {
        alias /var/www/osnai/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/(belajar|simulasi|latihan|hero-atmosphere|favicon)\.(webp|png|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # Auth API — rate-limited, no cache
    location /api/auth/ {
        limit_req zone=osnai_auth burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI API — rate-limited, no cache, long timeout for streamed responses
    location /api/ai/ {
        limit_req zone=osnai_ai burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        # AI mock slots / assistants can take a few minutes per request.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else — micro-cache HTML/JSON GETs for 10s
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;

        # Micro-cache only for GET + 200 + no-auth-cookie
        set $skip_cache 0;
        if ($request_method != GET)        { set $skip_cache 1; }
        if ($http_cookie ~* "better-auth") { set $skip_cache 1; }
        if ($http_cookie ~* "session")     { set $skip_cache 1; }
        proxy_cache_bypass $skip_cache;
        proxy_no_cache     $skip_cache;
        proxy_cache        osnai_cache;
        proxy_cache_valid  200 10s;
        proxy_cache_valid  404 5s;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
