services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: osnai
      POSTGRES_PASSWORD: osnai
      POSTGRES_DB: osnai
    ports:
      - "5432:5432"
    volumes:
      - osnai_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osnai -d osnai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      USE_PGLITE: "false"
      DATABASE_URL: postgresql://osnai:osnai@db:5432/osnai
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-to-a-long-random-secret}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      ALLOW_LOCAL_AI_PROVIDER: ${ALLOW_LOCAL_AI_PROVIDER:-false}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimax.io/v1}
      MINIMAX_MODEL_ID: ${MINIMAX_MODEL_ID:-MiniMax-M3}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting Docker}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
    depends_on:
      db:
        condition: service_healthy

volumes:
  osnai_pg:
